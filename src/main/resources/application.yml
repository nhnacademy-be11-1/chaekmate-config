server:
  port: 8888

spring:
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_REPO_URL}
          username: ${GIT_USERNAME}
          password: ${GIT_PASSWORD} #또는 personal access token 사용가능
          clone-on-start: true
          default-label: main

  application:
    name: chaekmate-config

eureka:
  client:
    register-with-eureka: true   # Eureka에 자기 등록
    fetch-registry: true         # 다른 서비스 레지스트리 정보 가져오기
