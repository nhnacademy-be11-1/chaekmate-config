spring:
  application:
    name: config-server # 이름을 config-server로 해야 Eureka가 Config server 취급함

eureka:
  client:
    register-with-eureka: true   # Eureka에 자기 등록
    fetch-registry: true         # 다른 서비스 레지스트리 정보 가져오기
    service-url:
      defaultZone: ${EUREKA_URL} # http://localhost:8761/eureka/
